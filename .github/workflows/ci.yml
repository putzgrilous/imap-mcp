name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc --noEmit

      - name: Build
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc -p tsconfig.build.json
