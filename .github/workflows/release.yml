name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Build
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Bundle
        run: npm run bundle

      - name: Package all platforms
        run: |
          npx @yao-pkg/pkg bundle.js --target node20-win-x64     --output dist-bin/imap-mcp-win-x64.exe
          npx @yao-pkg/pkg bundle.js --target node20-win-arm64   --output dist-bin/imap-mcp-win-arm64.exe
          npx @yao-pkg/pkg bundle.js --target node20-macos-x64   --output dist-bin/imap-mcp-macos-x64
          npx @yao-pkg/pkg bundle.js --target node20-macos-arm64 --output dist-bin/imap-mcp-macos-arm64
          npx @yao-pkg/pkg bundle.js --target node20-linux-x64   --output dist-bin/imap-mcp-linux-x64
          npx @yao-pkg/pkg bundle.js --target node20-linux-arm64 --output dist-bin/imap-mcp-linux-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
          generate_release_notes: true
